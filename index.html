function vReto(){const k=cur(),m=S.months[k],ml=MES[+k.slice(5)-1];
const ej=`<button class="lk" onclick="ficha(0,'ej')">Ver un pato de ejemplo</button>`;
const form=`<input id="f-skill" list="dl" placeholder="Habilidad (flexiones, equilibrio…)" value="${E(m?.skill)}"><datalist id="dl">${S.lib.map(x=>`<option>${E(x)}</option>`).join('')}</datalist>
<input id="f-start" placeholder="Punto de partida (p. ej. 5 flexiones)" value="${E(m?.start)}"><input id="f-goal" placeholder="Objetivo (p. ej. 15 flexiones)" value="${E(m?.goal)}">
<select id="f-freq">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${(m?.freq||3)==n?'selected':''}>${n} día${n>1?'s':''} por semana</option>`).join('')}</select><button onclick="saveReto()">Guardar reto</button>`;
if(!m)return`<div class="hero"><div><p>${ml}</p><h2>Elige tu reto del mes</h2><p>Un pato te espera al final.</p><p>${ej}</p></div>${duckSil('#fff',64)}</div><div class="card">${form}</div>`+vRegForm(false)+vLast();
const n=rd(k).size,t=tg(k),ok=n>=t,C=2*Math.PI*44;
const ss=S.ses.filter(s=>s.type=='reto'&&mk(s.date)==k),df=ss.filter(s=>s.diff);
return`<div class="hero"><div><p>${ml}</p><h2>${E(m.skill)}</h2><p>${E(m.start)||'—'} → ${E(m.goal)||'—'}</p><p>${m.freq} días por semana</p>${m.done?'':`<p>${ej}</p>`}</div><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff55" stroke-width="9"/><circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,n/t)} ${C}" transform="rotate(-90 50 50)"/></svg><b>${n}/${t}</b></div></div>
<div class="card">${m.done?`<p style="display:flex;align-items:center;gap:8px">${duckArt(m.duck,40)} <span>Reto conseguido · <button class="lk" onclick="ficha(${m.duck})">ver pato</button></span></p>`:`<button ${ok?'':'class="s"'} onclick="finish()">${ok?'Completar reto y descubrir pato':'Faltan '+(t-n)+' días para completar el reto'}</button>`}<details><summary class="mut">Editar reto</summary>${form}</details></div>`
+vRegForm(true)+vLast()+
`<div class="card"><h2>Informe de ${ml}</h2><p class="mut">${n} días · ${ss.length} sesiones${df.length?' · dificultad media '+(df.reduce((a,x)=>a+ +x.diff,0)/df.length).toFixed(1)+'/5':''}</p><textarea placeholder="Conclusiones del experimento…" onchange="setConcl('${k}',this.value)">${E(m.concl)}</textarea></div>`}
function setConcl(k,v){S.months[k].concl=v;touch(k);save()}
function saveReto(){const k=cur(),o=S.months[k]||{};S.months[k]={...o,skill:$('#f-skill').value.trim(),start:$('#f-start').value,goal:$('#f-goal').value,freq:+$('#f-freq').value,tests:o.tests||[],u:Date.now()};if(!S.months[k].skill)return alert('Escribe una habilidad');save();render()}
function finish(){const k=cur(),m=S.months[k];if(rd(k).size<tg(k))return alert('Aún te faltan días de práctica para completar el reto.');
const used=unl().map(x=>x.duck),free=D.map((_,i)=>i).filter(i=>!used.includes(i));if(!free.length)return;m.done=today();m.duck=free[Math.random()*free.length|0];touch(k);save();render();ficha(m.duck,'new')}

/* ---------- REGISTRO (ahora dentro de la pantalla Reto) ---------- */
const sRow=s=>`<div class="it"><b>${s.date}</b> ${s.type=='reto'?'🎯 '+E(S.months[mk(s.date)]?.skill):s.type=='habitual'?'🚴 '+E(s.act):'📓 Diario'} <button class="x" onclick="delS(${s.id})" aria-label="Borrar registro">✕</button><br><span class="mut">${[s.reps&&s.reps+' rep',s.min&&s.min+' min',s.diff&&'dif. '+s.diff+'/5',s.feel,s.easy&&'Fácil: '+s.easy,s.hard&&'Cuesta: '+s.hard,s.notes].filter(Boolean).map(E).join(' · ')}</span></div>`;
function vRegForm(hasReto){const t=regType||(hasReto?'reto':'habitual'),d=regDate||today();
return`<div class="card" id="reg"><h2>Registrar sesión</h2><input type="date" id="r-date" value="${d}" aria-label="Fecha"><input type="hidden" id="r-type" value="${t}">
<div class="chips" role="group" aria-label="Tipo de registro">${[['reto','🎯 Reto'],['habitual','🚴 Habitual'],['diario','📓 Diario']].map(x=>`<button data-t="${x[0]}" class="${x[0]==t?'on':''}" onclick="setT('${x[0]}')">${x[1]}</button>`).join('')}</div>
<select id="r-act" ${t=='habitual'?'':'hidden'} aria-label="Actividad">${HAB.map(x=>`<option>${x}</option>`).join('')}</select>
<div id="x-met" ${t=='diario'?'hidden':''}><div class="row"><input id="r-reps" type="number" inputmode="numeric" placeholder="Repeticiones"><input id="r-min" type="number" inputmode="numeric" placeholder="Minutos"></div><select id="r-diff" aria-label="Dificultad"><option value="">Dificultad</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>
<div id="x-dia" ${t=='diario'?'':'hidden'}><input id="r-easy" placeholder="Qué movimientos me resultan fáciles"><input id="r-hard" placeholder="Cuáles siguen costando"></div>
<input id="r-feel" placeholder="Sensaciones del cuerpo"><textarea id="r-notes" placeholder="Observaciones"></textarea><button onclick="addS()">Guardar registro</button></div>`}
function setT(t){regType=t;$('#r-type').value=t;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#r-act').hidden=t!='habitual';$('#x-met').hidden=t=='diario';$('#x-dia').hidden=t!='diario'}
function addS(){const g=i=>$('#r-'+i)?.value||'',t=g('type'),d=g('date')||today();if(t=='reto'&&!S.months[mk(d)])return alert('Define primero el reto de ese mes');
S.ses.push({id:Date.now(),date:d,type:t,act:t=='habitual'?g('act'):'',reps:g('reps'),min:g('min'),diff:g('diff'),feel:g('feel'),notes:g('notes'),easy:g('easy'),hard:g('hard')});sel=d;regDate=null;save();render();toast('Registro guardado ✓')}
function delS(id){if(confirm('¿Borrar este registro?')){S.ses=S.ses.filter(s=>s.id!=id);S.del.push(id);save();render()}}
const sorted=()=>[...S.ses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
function vLast(){const L=sorted().slice(0,3);return`<div class="card"><h2>Últimos registros</h2>${L.map(sRow).join('')||'<p class="mut">Aún no hay registros.</p>'}${S.ses.length>3?`<button class="s" onclick="go('hist')">Ver historial completo</button>`:''}</div>`}
function vHist(){const L=sorted();return`<div class="card"><h2>Historial · ${L.length}</h2>${L.slice(0,histN).map(sRow).join('')||'<p class="mut">Aún no hay registros. Añádelos desde la pestaña Reto.</p>'}${L.length>histN?`<button class="s" onclick="histN+=30;render()">Mostrar más</button>`:''}</div>`}

/* ---------- CALENDARIO ---------- */
function vCal(){const y=cal.getFullYear(),mo=cal.getMonth(),k=mk(iso(cal)),dim=new Date(y,mo+1,0).getDate(),off=(cal.getDay()+6)%7,R=rd(k),H=new Set(S.ses.filter(s=>s.type=='habitual'&&mk(s.date)==k).map(s=>s.date));
let c='';for(let i=0;i<off;i++)c+='<div></div>';
for(let d=1;d<=dim;d++){const x=`${k}-${String(d).padStart(2,'0')}`;c+=`<div class="dy ${R.has(x)?'r':''} ${H.has(x)?'h':''} ${x==today()?'t':''} ${x==sel?'sel':''}" onclick="sel='${x}';render()">${d}</div>`}
const ds=S.ses.filter(s=>s.date==sel),m=S.months[k];
return`<div class="card"><div class="row"><button class="s" onclick="cal.setMonth(cal.getMonth()-1);render()" aria-label="Mes anterior">‹</button><h2 style="text-align:center;flex:3;margin:auto">${MES[mo]} ${y}</h2><button class="s" onclick="cal.setMonth(cal.getMonth()+1);render()" aria-label="Mes siguiente">›</button></div>
<div class="g7 mut" style="margin:8px 0">${'LMXJVSD'.split('').map(x=>`<div>${x}</div>`).join('')}</div><div class="g7">${c}</div>
<p class="mut">${m?`Constancia: ${R.size} de ${tg(k)} días del reto. `:''}Azul = reto · punto = entrenamiento habitual</p></div>
<div class="card"><h2>${sel}</h2>${ds.map(sRow).join('')||'<p class="mut">Sin registros.</p>'}
<div class="row"><button onclick="quick()">✓ Marcar reto</button><button class="s" onclick="go('reto','${sel}')">+ Registrar</button></div></div>`}
function quick(){if(!S.months[mk(sel)])return alert('Define primero el reto de ese mes');if(S.ses.some(s=>s.date==sel&&s.type=='reto'))return;S.ses.push({id:Date.now(),date:sel,type:'reto'});save();render()}

/* ---------- PATOS ---------- */
function vDucks(){const U=unl(),by={};U.forEach(m=>by[m.duck]=1);
return`<div class="card"><h2>Patoteca · ${U.length}/12</h2><div class="dg">${D.map((d,i)=>by[i]?`<button class="dk" onclick="ficha(${i})">${duckArt(i,64)}<span>${d[0]}</span></button>`:`<div class="dk lock">${duckSil('#c9d8e2',56)}<span>?</span></div>`).join('')}</div>
<p class="mut" style="margin-top:12px">Cada reto completado descubre un pato al azar. <button class="lk" onclick="ficha(0,'ej')" style="color:var(--b)">Ver un pato de ejemplo</button></p></div>`+vYear()}
function vYear(){const y=new Date().getFullYear();return`<div class="card"><h2>Resumen ${y}</h2>${MES.map((n,i)=>{const m=S.months[`${y}-${String(i+1).padStart(2,'0')}`];return`<div class="it"><b>${n}</b> ${m?E(m.skill)+' · '+(m.done?'✅ '+D[m.duck][0]:'en curso'):'<span class="mut">—</span>'}</div>`}).join('')}</div>`}
function closeM(){$('#md').hidden=true}
function ficha(i,mode){const d=D[i],e=$('#md');e.hidden=false;e.onclick=ev=>{if(ev.target==e)closeM()};
e.innerHTML=`<div class="card">${mode=='new'?'<h2>🎉 ¡Nueva especie descubierta!</h2>':mode=='ej'?'<span class="tag">Ejemplo de pato que puedes ganar</span>':''}<div class="stage"><div class="${mode=='new'?'pop':''}">${duckArt(i,230,1)}</div></div><h2>${d[0]}</h2><p class="mut"><i>${d[1]}</i></p><p>${d[2]}</p>${mode=='ej'?'<p class="mut">Es solo un ejemplo: tu pato se elige al azar cuando completas un reto.</p>':''}<img id="ph" alt="" hidden><button onclick="closeM()">Cerrar</button></div>`;
fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(d[1])).then(r=>r.json()).then(j=>{const u=j.thumbnail?.source,im=$('#ph');if(u&&im){im.onload=()=>im.hidden=false;im.src=u}}).catch(()=>{})}
addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});

/* ---------- MÁS ---------- */
function vMore(){const n=S.ses.filter(s=>s.type=='reto').length,u=unl().length,sk=streaks(),dia=S.ses.filter(s=>s.type=='diario').length;
const B=[['🌱','Primer paso',n>=1],['🔥','Racha de 7 días',sk>=7],['💪','20 sesiones de reto',n>=20],['🦆','Primer pato',u>=1],['🪺','3 patos',u>=3],['🏞️','6 patos',u>=6],['👑','Los doce patos',u>=12],['📓','5 entradas de diario',dia>=5],['📚','5 ideas en la biblioteca',S.lib.length>=5]];
return`<div class="card"><h2>Insignias</h2>${B.map(b=>`<div class="it" style="${b[2]?'':'opacity:.35'}">${b[0]} ${b[1]}</div>`).join('')}</div>
<div class="card"><h2>Biblioteca de retos</h2>${S.lib.map((x,i)=>`<div class="it">${E(x)} <button class="x" onclick="libDel(${i})" aria-label="Quitar">✕</button></div>`).join('')}<div class="row"><input id="l-n" placeholder="Nueva idea"><button style="flex:0 0 90px" onclick="libAdd()">Añadir</button></div></div>`
+vSync()+vInstall()+
`<div class="card"><h2>Tus datos</h2><p class="mut">Siempre se guardan en este dispositivo${cfg()?' y se copian a tu Gist':''}. Si no usas el Gist, haz copias a mano.</p><button class="s" onclick="dl()">Exportar copia (JSON)</button><button class="s" onclick="$('#imp').click()">Importar copia (JSON)</button><input id="imp" type="file" accept="application/json,.json" hidden onchange="imp(this)"><button class="s" onclick="wipe()">Borrar todos los datos</button><p class="mut" style="margin-top:12px">Patolmés v${VER}</p></div>`}
function libAdd(){const v=$('#l-n').value.trim();if(v){S.lib.push(v);S.lt=Date.now();save();render()}}
function libDel(i){S.lib.splice(i,1);S.lt=Date.now();save();render()}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='patolmes-'+today()+'.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{let j;try{j=JSON.parse(t)}catch{return alert('Ese archivo no es un JSON válido.')}
if(!j||typeof j!='object'||typeof j.months!='object'||!Array.isArray(j.ses))return alert('Ese archivo no parece una copia de Patolmés.');
if(!confirm('Se combinarán los datos del archivo con los que ya tienes (no se borra nada). ¿Continuar?'))return;
S=merge(S,j);save();render();toast('Copia importada ✓')}).finally(()=>inp.value='')}
function wipe(){if(!confirm('¿Borrar TODOS los datos'+(cfg()?' (también en tu Gist)':'')+'? Antes puedes exportar una copia.'))return;const now=Date.now();S={t:now,rs:now,months:{},ses:[],lib:[...LIB0],lt:now,del:[]};save();render()}

/* ---------- SINCRONIZACIÓN CON GIST ---------- */
const GF='patolmes.json',GA='https://api.github.com/gists';
const cfg=()=>{try{const c=JSON.parse(localStorage.getItem('pm_sync'));return c&&c.token&&c.gist?c:null}catch{return null}};
let sy={st:cfg()?'idle':'off',at:+localStorage.getItem('pm_sync_at')||0,msg:''},busy=false,again=false,pushT;
const hdr=t=>({Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const gid=v=>{const m=String(v||'').match(/[0-9a-f]{20,40}/gi);return m?m[m.length-1]:''};
function norm(o){const ms={};Object.keys(o.months||{}).sort().forEach(k=>ms[k]=o.months[k]);return{rs:o.rs||0,months:ms,ses:[...(o.ses||[])].sort((a,b)=>a.id-b.id),lib:o.lib||[],lt:o.lt||0,del:[...new Set(o.del||[])].sort((a,b)=>a-b)}}
function merge(a,b){const rs=Math.max(a.rs||0,b.rs||0),del=[...new Set([...(a.del||[]),...(b.del||[])])].filter(x=>x>rs),ds=new Set(del),ses=new Map();
[...(a.ses||[]),...(b.ses||[])].forEach(s=>{if(s&&s.id>rs&&!ds.has(s.id))ses.set(s.id,s)});
const months={};new Set([...Object.keys(a.months||{}),...Object.keys(b.months||{})]).forEach(k=>{const x=a.months?.[k],y=b.months?.[k],m=!x?y:!y?x:((x.u||0)>=(y.u||0)?x:y);if(m&&(m.u||0)>=rs)months[k]=m});
const la=a.lt||0,lb=b.lt||0,lib=la==lb?[...new Set([...(a.lib||[]),...(b.lib||[])])]:la>lb?a.lib||[]:b.lib||[];
return{t:Math.max(a.t||0,b.t||0),rs,months,ses:[...ses.values()],lib,lt:Math.max(la,lb),del}}
function setSy(st,msg){sy.st=st;sy.msg=msg||'';const b=$('#sy');if(b){b.className=st=='ok'?'ok':st=='err'?'er':'';b.textContent=st=='off'?'☁ Sin copia':st=='busy'?'☁ Sincronizando…':st=='err'?'⚠ Sin sincronizar':st=='idle'?'☁ Conectado':'☁ Sincronizado'}if(tab=='mas'&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName))render()}
const ago=t=>{if(!t)return'nunca';const m=Math.round((Date.now()-t)/6e4);return m<1?'ahora mismo':m<60?'hace '+m+' min':m<1440?'hace '+Math.round(m/60)+' h':'el '+new Date(t).toLocaleDateString('es-ES')}
async function gapi(url,opt,tk){let r;try{r=await fetch(url,{...opt,headers:{...hdr(tk),...(opt?.headers||{})},cache:'no-store'})}catch{throw new Error('Sin conexión con GitHub. Se reintentará más tarde.')}
if(r.status==401)throw new Error('El token no es válido o ha caducado.');if(r.status==403)throw new Error('GitHub rechazó la petición (¿el token tiene permiso "gist"? ¿demasiadas peticiones?).');if(r.status==404)throw new Error('No encuentro ese Gist con ese token. Revisa el ID y que sea de la misma cuenta que el token.');if(!r.ok)throw new Error('Error de GitHub ('+r.status+').');return r.json()}
async function readRemote(c){const g=await gapi(GA+'/'+c.gist,{},c.token),f=g.files?.[GF];if(!f)throw new Error('Ese Gist no contiene '+GF+'. Déjalo vacío para crear uno nuevo.');
let t=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});t=await r.text()}try{return JSON.parse(t)}catch{throw new Error('El Gist tiene un '+GF+' que no se puede leer.')}}
const body=()=>JSON.stringify(norm(S),null,1);
async function syncNow(){const c=cfg();if(!c)return;if(busy){again=true;return}busy=true;setSy('busy');
try{const r=await readRemote(c),m=merge(S,r),changed=JSON.stringify(norm(m))!=JSON.stringify(norm(S));
if(changed){S=m;persist();if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))render()}
if(JSON.stringify(norm(m))!=JSON.stringify(norm(r)))await gapi(GA+'/'+c.gist,{method:'PATCH',body:JSON.stringify({files:{[GF]:{content:body()}}})},c.token);
sy.at=Date.now();localStorage.setItem('pm_sync_at',sy.at);setSy('ok')}
catch(e){setSy('err',e.message)}finally{busy=false;if(again){again=false;queuePush()}}}
function queuePush(){if(!cfg())return;clearTimeout(pushT);pushT=setTimeout(syncNow,1500)}
async function connect(){const tk=$('#s-tk')?.value.trim()||cfg()?.token||'',raw=$('#s-id')?.value.trim(),id=gid(raw);if(!tk)return alert('Pega tu token de GitHub (con permiso "gist").');
if(raw&&!id)return alert('Ese ID de Gist no parece válido. Es un código de letras y números que aparece al final de la URL del Gist.');
setSy('busy');try{let gistId=id;
if(!gistId){const g=await gapi(GA,{method:'POST',body:JSON.stringify({description:'Patolmés · copia de datos',public:false,files:{[GF]:{content:body()}}})},tk);gistId=g.id}
localStorage.setItem('pm_sync',JSON.stringify({token:tk,gist:gistId}));await syncNow();if(sy.st=='ok')toast('Conectado ✓')}catch(e){setSy('err',e.message)}}
function disconnect(){if(!confirm('Se quitará el token de este dispositivo. Tus datos y el Gist se quedan como están.'))return;localStorage.removeItem('pm_sync');localStorage.removeItem('pm_sync_at');sy.at=0;setSy('off');render()}
function vSync(){const c=cfg();
const help=`<details><summary class="mut">¿Cómo consigo el token?</summary><p class="mut">En GitHub: Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token. Marca solo el permiso <b>gist</b> y copia el token. No lo subas nunca al repositorio.</p><p class="mut">Para usar otro dispositivo, pon ahí el mismo token y el mismo ID de Gist.</p></details>`;
if(c)return`<div class="card"><h2>Copia en la nube</h2><p>${sy.st=='err'?'<b style="color:var(--er)">⚠ '+E(sy.msg)+'</b>':sy.st=='busy'?'Sincronizando…':'Sincronizado '+ago(sy.at)}</p><p class="mut">ID del Gist (cópialo para el móvil u otros dispositivos):</p><input id="s-id" value="${c.gist}" readonly onclick="this.select()"><button onclick="syncNow()">Sincronizar ahora</button><button class="s" onclick="disconnect()">Desconectar este dispositivo</button>${help}</div>`;
return`<div class="card"><h2>Copia en la nube</h2><p class="mut">Guarda tus datos en un Gist privado de tu GitHub, así no los pierdes aunque cambies de móvil o borres el navegador.</p><input id="s-tk" type="password" autocomplete="off" placeholder="Token de GitHub (permiso gist)"><input id="s-id" placeholder="ID del Gist (vacío = crear uno nuevo)" autocomplete="off"><button onclick="connect()">Conectar y sincronizar</button>${sy.st=='err'?`<p style="color:var(--er)">⚠ ${E(sy.msg)}</p>`:''}${help}</div>`}

/* ---------- INSTALAR ---------- */
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab=='mas')render()});addEventListener('appinstalled',()=>{dip=null;render()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function vInstall(){if(standalone())return'';const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
return`<div class="card"><h2>Instalar en el móvil</h2>${dip?`<button onclick="dip.prompt()">Instalar Patolmés</button>`:ios?'<p class="mut">En Safari: Compartir → Añadir a pantalla de inicio.</p>':'<p class="mut">En Chrome: menú ⋮ → Instalar aplicación (o Añadir a pantalla de inicio).</p>'}</div>`}

/* ---------- RENDER ---------- */
const TABS=[['reto','🎯','Reto',vReto],['cal','📅','Calendario',vCal],['hist','📋','Historial',vHist],['pat','🦆','Patos',vDucks],['mas','⚙️','Más',vMore]];
function render(){const warn=location.protocol=='file:'?`<div class="warn"><b>Estás abriendo el archivo en local</b>Lo que guardes aquí no está en la versión online ni se sincroniza con tu móvil. Abre la app desde su dirección web.</div>`:'';
$('#app').innerHTML=warn+TABS.find(t=>t[0]==tab)[3]();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" ${t[0]==tab?'aria-current="page"':''} onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}
$('#lg').innerHTML=duckSil('#3fa4dc',38);
const q=new URLSearchParams(location.search);if(q.get('a')=='reg')tab='reto';
